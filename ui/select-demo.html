<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FaraiOS dropdown reference</title><link rel="stylesheet" href="../business/profile.css"><link rel="stylesheet" href="select.css?v=1"><script src="select.js?v=1" defer></script></head>
<body><main class="public-main"><section class="public-card"><h1>Dropdown reference</h1><p>Shared FaraiOS control. Example data only.</p><form method="get"><label for="demo-area">Service area</label><select id="demo-area" name="service_area" data-faraios-select required><option value="">Select service area</option><option value="Claremont">Claremont</option><option value="Newlands">Newlands</option><option value="Rondebosch">Rondebosch</option><option value="Southern Suburbs">Cape Town’s Southern Suburbs</option><option value="unavailable" disabled>Unavailable example</option></select><label for="demo-disabled">Disabled control</label><select id="demo-disabled" data-faraios-select disabled><option>Unavailable</option></select><button class="button" type="submit">Check required field</button><button class="button secondary" type="reset">Reset example</button></form><p>Use arrows, Enter, Escape and letters to navigate. These controls do not save any business configuration.</p></section></main></body></html>
