name: Private configuration recovery regression
on: [pull_request]
permissions:
  contents: read
jobs:
  crypto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y php-cli
      - run: php tests/private-config.php
      - run: php tests/watchdog.php
