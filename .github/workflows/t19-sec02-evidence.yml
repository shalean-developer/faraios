name: T19 SEC-02 disposable evidence coordinator
on:
  pull_request:
    paths:
      - 'test-support/t19-sec02-evidence-disposable.sql'
      - 'test-support/t19-sec02-evidence-disposable.sh'
      - 'src/t19-sec02-evidence*.js'
      - 'test/t19-sec02-evidence-bridge.test.js'
      - '.github/workflows/t19-sec02-evidence.yml'
permissions:
  contents: read
jobs:
  synthetic-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: t19_fixture
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: faraios_t19_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t19_fixture -d faraios_t19_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: faraios_t19_test
      PGUSER: t19_fixture
      PGPASSWORD: synthetic-only
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v5
      - name: Ensure PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Guard and build disposable coordinator
        run: psql -X -v ON_ERROR_STOP=1 -c "set faraios.sec02='synthetic'" -f test-support/t19-sec02-evidence-disposable.sql
      - name: Assert one-time, concurrent and interrupted evidence consumption
        run: bash test-support/t19-sec02-evidence-disposable.sh
      - name: Run new verified evidence bridge tests explicitly
        run: node --test test/t19-sec02-evidence-bridge.test.js
