name: Instant booking preview
on:
  pull_request:
    paths:
      - 'docs/instant-booking/**'
      - 'b/instant.php'
      - 'account/instant-settings.php'
      - 'account/requests-core.php'
      - 'business/instant*'
      - 'business/booking.js'
      - 'tests/instant-*'
      - '.github/workflows/instant-preview.yml'
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eb97fe51cb5dbee4654f2fbe7090aeb7229826e7
          path: baseline
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-16 php-cli php-pgsql
      - run: php -l b/instant.php && php -l business/instant-core.php && php -l account/instant-settings.php && node --check business/booking.js
      - run: python3 tests/instant-checkout.py
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
