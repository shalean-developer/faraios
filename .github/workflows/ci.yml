name: Foundation checks
on:
  push:
    branches:
      - main
      - staging
  pull_request:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5 # Node.js 24
      - name: Build Node 24 / PostgreSQL 17 synthetic policy runner
        shell: bash
        run: |
          set -o pipefail
          git archive --format=tar HEAD | docker build --file scripts/ci-policy.Dockerfile --tag faraios-ci-policy -
      - name: Policy and native PostgreSQL regression tests
        run: >-
          docker run --rm --network none --cpus 2 --memory 4g
          --cap-drop ALL --security-opt no-new-privileges
          faraios-ci-policy
  zoho-setup-windows:
    runs-on: windows-2025
    # Real owner-only ACL checks are repeated at the private-profile boundary.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5 # Node.js 24
      - uses: actions/setup-node@v5 # Node.js 24
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - run: node --check scripts/setup-zoho-staging.mjs
      - run: node --check scripts/verify-staging-access.mjs
      - run: node --check scripts/backup-staging.mjs
      - run: node --check scripts/restore-diagnostic.mjs
      - run: node --check scripts/restore-constraint.mjs
      - run: node --check scripts/clear-restore-staff-sessions.mjs
      - run: node --test test/zoho-setup.test.js test/staging-access-verifier.test.js test/backup-profile.test.js test/staging-backup.test.js test/isolated-restore.test.js test/restore-diagnostic.test.js test/restore-constraint.test.js test/restore-session-recovery.test.js
      - name: T19 synthetic connection, masked import and real dummy DPAPI acceptance
        run: npm run test:t19:connection

  backup-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5 # Node.js 24
      - uses: actions/setup-node@v5 # Node.js 24
        with:
          node-version: '24.22.1'
      - run: node scripts/check-backup-transport.mjs

  private-custody-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - name: Warm exact registry-integrity-checked dependency cache
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Package and inactive-install regression tests
        run: node --test test/t19-private-package.test.js
      - name: Build offline inactive production package and verify import-only behavior
        run: node scripts/build-t19-private-package.mjs "$RUNNER_TEMP/t19-private-package"
      - name: Preserve public-source-only package for owner review
        id: custody-package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t19-inactive-private-package
          path: ${{ runner.temp }}/t19-private-package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Record package transport digest
        env:
          T19_ARTIFACT_DIGEST: ${{ steps.custody-package.outputs.artifact-digest }}
        run: printf 'T19_PACKAGE_ARTIFACT_SHA256=%s\n' "$T19_ARTIFACT_DIGEST"
