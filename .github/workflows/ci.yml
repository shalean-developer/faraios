name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build Node 24 / PostgreSQL 17 synthetic policy runner
        shell: bash
        run: |
          set -o pipefail
          git archive --format=tar HEAD | docker build --file scripts/ci-policy.Dockerfile --tag faraios-ci-policy -
      - name: Policy and native PostgreSQL security acceptance
        run: >-
          docker run --rm --network none --cpus 2 --memory 4g
          --cap-drop ALL --security-opt no-new-privileges
          faraios-ci-policy
  zoho-setup-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --check scripts/setup-zoho-staging.mjs
      - run: node --check scripts/verify-staging-access.mjs
      - run: node --check scripts/backup-staging.mjs
      - run: node --check scripts/restore-diagnostic.mjs
      - run: node --check scripts/restore-constraint.mjs
      - run: node --check scripts/clear-restore-staff-sessions.mjs
      - run: node --test test/zoho-setup.test.js test/staging-access-verifier.test.js test/staging-backup.test.js test/isolated-restore.test.js test/restore-diagnostic.test.js test/restore-constraint.test.js test/restore-session-recovery.test.js


  backup-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-backup-transport.mjs
