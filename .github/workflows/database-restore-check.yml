name: Isolated uploaded website recovery check
on:
  push:
    branches: [verify/mon01-archive-20261119]
permissions:
  contents: read
  actions: read
jobs:
  release-restore:
    if: github.ref == 'refs/heads/verify/mon01-archive-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 44483935230
          name: faraios-private-config
          path: ${{ runner.temp }}/key
      - name: Restore exact uploaded archive into a new private directory
        env:
          BACKUP_PASSPHRASE: ${{ secrets.FARAIOS_BACKUP_PASSPHRASE }}
          RECOVERY_READ_TOKEN: ${{ secrets.FARAIOS_RECOVERY_READ_TOKEN }}
        run: /usr/bin/python3 docs/v1-023/verify_uploaded.py
      - name: Remove disposable inputs and restored files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/key" "$RUNNER_TEMP/v1023-offline" "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/release.encrypted.json"
