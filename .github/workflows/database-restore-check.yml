name: Isolated database restore check
on:
  push:
    branches: [verify/v1-023-release-20261117]
permissions:
  contents: read
  actions: read
jobs:
  release-restore:
    if: github.ref == 'refs/heads/verify/v1-023-release-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 44116724464
          name: faraios-private-config
          path: ${{ runner.temp }}/key
      - name: Verify downloaded files and restore into a new private directory
        env:
          BACKUP_PASSPHRASE: ${{ secrets.FARAIOS_BACKUP_PASSPHRASE }}
          SEALED_READ_LINKS: '{"manifest.json":"","release.encrypted.json":""}'
        run: /usr/bin/python3 docs/v1-023/run_check.py
      - name: Remove disposable inputs and restored files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/key" "$RUNNER_TEMP/v1023-offline" "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/release.encrypted.json"
