name: Foundation regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native test runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gpg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | grep -q B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17 php-cli php-curl php-sqlite3
      - name: PHP syntax
        run: find account business b invoice quote notifications scripts -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Render synthetic UI preview
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: |
          python3 tests/ui-only.py
          python3 tests/ui-preview.py
      - name: Keep synthetic UI preview
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ui-preview
          path: test-results/release/ui-preview/preview.zip
          retention-days: 7
      - name: Native journeys, isolation, outage recovery and restore rehearsal
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 tests/release-checks.py
      - name: Keep release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-regression-evidence
          path: test-results/release/
          retention-days: 14
