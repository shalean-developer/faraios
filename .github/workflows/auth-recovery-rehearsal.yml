name: Isolated Auth recovery rehearsal
on:
  pull_request:
    paths:
      - scripts/auth_recovery.py
      - scripts/database-restore-check.py
      - .github/workflows/auth-recovery-rehearsal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Real Auth and API recovery with synthetic identities
        run: python3 scripts/auth_recovery.py > auth-recovery-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: auth-recovery-aggregate-evidence
          path: auth-recovery-report.json
          retention-days: 14
