name: Independent FaraiOS operations monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: faraios-independent-monitor
  cancel-in-progress: false
jobs:
  monitor:
    uses: ./.github/workflows/database-restore-check.yml
    with:
      configuration_action: monitor
    secrets:
      FARAIOS_BACKUP_PASSPHRASE: ${{ secrets.FARAIOS_BACKUP_PASSPHRASE }}
