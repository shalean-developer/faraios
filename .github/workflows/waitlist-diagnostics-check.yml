name: Waitlist diagnostic regression
on:
  pull_request:
    paths:
      - 'waitlist/core.php'
      - 'scripts/waitlist.php'
      - 'tests/waitlist-diagnostics.py'
      - '.github/workflows/waitlist-diagnostics-check.yml'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: php -l waitlist/core.php && php -l scripts/waitlist.php
      - run: python3 tests/waitlist-diagnostics.py
