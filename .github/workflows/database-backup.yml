name: Encrypted FaraiOS database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
permissions:
  contents: read
concurrency:
  group: faraios-database-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Export and verify encrypted backup
        env:
          PGHOST: ${{ vars.FARAIOS_BACKUP_HOST }}
          PGPORT: '5432'
          PGUSER: ${{ vars.FARAIOS_BACKUP_USER }}
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets.FARAIOS_BACKUP_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.FARAIOS_BACKUP_PASSPHRASE }}
          BACKUP_PG_IMAGE: postgres:17.11
          BACKUP_OUTPUT: ${{ runner.temp }}/faraios-encrypted-backups
        run: python3 scripts/database-backup.py
      - name: Retain only encrypted backup and checksum
        uses: actions/upload-artifact@v4
        with:
          name: faraios-encrypted-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/faraios-encrypted-backups/*.gpg
            ${{ runner.temp }}/faraios-encrypted-backups/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner ciphertext copy
        if: always()
        run: rm -rf -- "${{ runner.temp }}/faraios-encrypted-backups"
