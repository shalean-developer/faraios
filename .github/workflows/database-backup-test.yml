name: Database backup regression
on:
  pull_request:
    paths:
      - scripts/database-backup.py
      - tests/**
      - .github/workflows/database-backup*.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 php-cli gnupg
      - run: python3 tests/database-backup.py
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
          PHP_BIN: /usr/bin/php
