name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: faraios_t16_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      T16_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/faraios_t16_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: T19 isolated PostgreSQL security acceptance
        run: T19_PG_BIN="$(pg_config --bindir)" npm run test:accounting:postgres
  zoho-setup-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --check scripts/setup-zoho-staging.mjs
      - run: node --check scripts/verify-staging-access.mjs
      - run: node --check scripts/backup-staging.mjs
      - run: node --check scripts/restore-diagnostic.mjs
      - run: node --check scripts/restore-constraint.mjs
      - run: node --check scripts/clear-restore-staff-sessions.mjs
      - run: node --test test/zoho-setup.test.js test/staging-access-verifier.test.js test/staging-backup.test.js test/isolated-restore.test.js test/restore-diagnostic.test.js test/restore-constraint.test.js test/restore-session-recovery.test.js


  backup-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-backup-transport.mjs
